[project]
name = "aevora-core"
version = "0.2.0"
requires-python = ">=3.12,<3.13"
dependencies = ["starlette>=0.47,<1", "uvicorn>=0.35,<1", "websockets>=15,<17", "jsonschema>=4.25,<5", "httpx>=0.28,<1"]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
pythonpath = ["services/agent"]
testpaths = ["tests"]
